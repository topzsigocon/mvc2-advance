name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # devkitPro recommends its prebuilt Docker toolchain images for CI;
    # avoids the apt.devkitpro.org bootstrap endpoint that returned HTTP 403.
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          echo "DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}"
          echo "DEVKITARM=${DEVKITARM:-/opt/devkitpro/devkitARM}"
          command -v arm-none-eabi-g++
          arm-none-eabi-g++ --version
          make --version

      - name: Fetch Butano
        run: git clone --depth 1 https://github.com/GValiente/butano.git butano

      - name: Build ROM and preserve compiler log
        shell: bash
        run: |
          mkdir -p build-logs
          set -o pipefail
          make -j2 2>&1 | tee build-logs/build.log

      - name: Validate ROM
        run: |
          test -s mvc2_gba_fan_edition.gba
          size=$(stat -c%s mvc2_gba_fan_edition.gba)
          test "$size" -ge 1024
          test "$size" -le 33554432
          echo "ROM size: $size bytes"

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: mvc2-gba-fan-edition-rom
          path: mvc2_gba_fan_edition.gba
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvc2-gba-build-logs
          path: build-logs/
          if-no-files-found: warn
