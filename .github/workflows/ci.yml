name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install devkitARM
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git unzip
          curl -fsSL https://apt.devkitpro.org/install-devkitpro-pacman | sudo bash
          sudo dkp-pacman -Sy --noconfirm
          sudo dkp-pacman -S --noconfirm gba-dev

      - name: Configure environment
        run: |
          echo "/opt/devkitpro/devkitARM/bin" >> "$GITHUB_PATH"
          echo "DEVKITPRO=/opt/devkitpro" >> "$GITHUB_ENV"
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> "$GITHUB_ENV"

      - name: Fetch Butano
        run: git clone --depth 1 https://github.com/GValiente/butano.git butano

      - name: Build ROM
        run: make -j2

      - name: Validate ROM
        run: |
          test -s mvc2_gba_fan_edition.gba
          size=$(stat -c%s mvc2_gba_fan_edition.gba)
          test "$size" -ge 1024
          test "$size" -le 33554432
          echo "ROM size: $size bytes"

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: mvc2-gba-fan-edition-rom
          path: mvc2_gba_fan_edition.gba
          if-no-files-found: error
          retention-days: 30

      - name: Preserve build logs
        if: always()
        run: |
          mkdir -p build-logs
          echo "Workflow: $GITHUB_WORKFLOW" > build-logs/build-info.txt
          echo "Run: $GITHUB_RUN_ID" >> build-logs/build-info.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvc2-gba-build-logs
          path: build-logs/
          if-no-files-found: warn
