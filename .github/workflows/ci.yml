name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.zip"
      - "updates/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Fetch Butano
        run: git clone --depth 1 https://github.com/GValiente/butano.git butano

      - name: Verify toolchain and build ROM in official devkitPro container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs

          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            --entrypoint /bin/bash \
            devkitpro/devkitarm:20260610 \
            -lc '
              set -euo pipefail
              export DEVKITPRO=/opt/devkitpro
              export DEVKITARM="$DEVKITPRO/devkitARM"
              export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

              echo "DEVKITPRO=$DEVKITPRO"
              echo "DEVKITARM=$DEVKITARM"
              echo "Compiler:"
              command -v arm-none-eabi-g++
              arm-none-eabi-g++ --version
              echo "Make:"
              command -v make
              make --version

              echo "Starting Butano GBA build..."
              make -j2 2>&1 | tee build-logs/build.log
            '

      - name: Validate ROM
        shell: bash
        run: |
          set -euo pipefail
          test -s mvc2_gba_fan_edition.gba
          size=$(stat -c%s mvc2_gba_fan_edition.gba)
          if [ "$size" -lt 1024 ] || [ "$size" -gt 33554432 ]; then
            echo "::error::ROM size is outside the expected GBA range: $size bytes"
            exit 1
          fi
          echo "ROM size: $size bytes"

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: mvc2-gba-fan-edition-rom
          path: mvc2_gba_fan_edition.gba
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvc2-gba-build-logs
          path: build-logs/
          if-no-files-found: warn
