name: GBA ROM Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build One Piece Grand Pirate Clash
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install image processing tools
        run: |
          apt-get update
          apt-get install -y python3-pil

      - name: Get Butano Engine
        run: |
          mkdir -p vendor
          git clone --depth 1 https://github.com/GValiente/butano.git vendor/butano

      - name: Fix title screen dimensions
        run: |
          python3 - <<'PY'
          from PIL import Image

          path = "graphics/title_screen.bmp"
          img = Image.open(path)

          if img.mode != "P":
              img = img.convert("P", palette=Image.Palette.ADAPTIVE, colors=256)

          canvas = Image.new("P", (256, 256), 0)
          canvas.putpalette(img.getpalette())
          canvas.paste(img, (8, 48))
          canvas.save(path, format="BMP")

          check = Image.open(path)
          print("Title screen dimensions:", check.size)

          if check.size != (256, 256):
              raise SystemExit("ERROR: Title screen dimensions are incorrect.")

          print("Title screen successfully prepared.")
          PY

      - name: Build GBA ROM
        run: make -j2

      - name: Validate GBA ROM
        run: |
          mkdir -p dist

          ROM=$(find . -type f -name "*.gba" -not -path "./vendor/*" -print -quit)

          if [ -z "$ROM" ]; then
            echo "ERROR: No GBA ROM was generated."
            exit 1
          fi

          SIZE=$(stat -c%s "$ROM")

          if [ "$SIZE" -le 0 ]; then
            echo "ERROR: ROM file is empty."
            exit 1
          fi

          if [ "$SIZE" -gt 33554432 ]; then
            echo "ERROR: ROM exceeds the 32 MB limit."
            exit 1
          fi

          cp "$ROM" dist/One-Piece-Grand-Pirate-Clash.gba

          cd dist
          sha256sum One-Piece-Grand-Pirate-Clash.gba > SHA256SUMS.txt

          echo "ROM successfully validated."
          ls -lh

      - name: Upload GBA ROM
        uses: actions/upload-artifact@v4
        with:
          name: one-piece-grand-pirate-clash-gba-rom
          path: dist/
          if-no-files-found: error
          retention-days: 30
