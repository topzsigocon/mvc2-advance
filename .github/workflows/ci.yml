name: Marvel vs Capcom 2 GBA Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Marvel vs Capcom 2 GBA Fan Edition
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Butano Engine
        run: |
          mkdir -p butano
          git clone --depth 1 https://github.com/GValiente/butano.git butano

      - name: Show toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          command -v arm-none-eabi-g++
          arm-none-eabi-g++ --version
          make --version

      - name: Build GBA ROM
        run: make -j2

      - name: Validate GBA ROM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          ROM="mvc2_gba_fan_edition.gba"

          if [ ! -s "$ROM" ]; then
            echo "::error::Expected ROM was not generated: $ROM"
            echo "GBA files found in the repository:"
            find . -type f -name "*.gba" -not -path "./butano/*" -print
            exit 1
          fi

          SIZE=$(stat -c%s "$ROM")

          if [ "$SIZE" -lt 1024 ]; then
            echo "::error::ROM is unexpectedly small ($SIZE bytes)."
            exit 1
          fi

          if [ "$SIZE" -gt 33554432 ]; then
            echo "::error::ROM exceeds the 32 MB GBA limit."
            exit 1
          fi

          cp "$ROM" dist/Marvel-vs-Capcom-2-GBA-Fan-Edition.gba
          cd dist
          sha256sum Marvel-vs-Capcom-2-GBA-Fan-Edition.gba > SHA256SUMS.txt

          echo "ROM successfully validated."
          ls -lh

      - name: Upload GBA ROM
        uses: actions/upload-artifact@v4
        with:
          name: marvel-vs-capcom-2-gba-rom
          path: dist/
          if-no-files-found: error
          retention-days: 30
