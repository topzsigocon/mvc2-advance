name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip git unzip wget

      - name: Install devkitPro / devkitARM
        run: |
          # Official-ish non-interactive install for GBA
          wget https://github.com/devkitPro/pacman/releases/download/v1.0.2/devkitpro-pacman.amd64.deb -O /tmp/dkp-pacman.deb
          sudo dpkg -i /tmp/dkp-pacman.deb || true
          sudo apt-get install -f -y
          sudo dkp-pacman -Syu --noconfirm
          sudo dkp-pacman -S --noconfirm gba-dev
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> $GITHUB_ENV
          echo "PATH=$PATH:/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin" >> $GITHUB_ENV

      - name: Setup Butano
        run: |
          git clone --depth 1 https://github.com/GValiente/butano.git /tmp/butano
          # Point Makefile to the cloned butano
          sed -i 's|LIBBUTANO    := ../butano/butano|LIBBUTANO    := /tmp/butano/butano|' Makefile
          ls -la /tmp/butano/butano

      - name: Build ROM
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=$PATH:/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin
          make -j$(nproc)

      - name: Verify ROM exists
        run: |
          test -f mvc2_gba_fan.gba || { echo "ROM not found"; ls -la; exit 1; }
          ls -lh mvc2_gba_fan.gba
          file mvc2_gba_fan.gba

      - uses: actions/upload-artifact@v4
        with:
          name: mvc2-gba-fan-rom
          path: mvc2_gba_fan.gba
          if-no-files-found: error
