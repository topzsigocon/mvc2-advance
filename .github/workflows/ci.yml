name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Official devkitPro image – already has devkitARM + gba-dev packages
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install extra tools + clone Butano
        run: |
          which python3 || which python
          which make
          which arm-none-eabi-gcc
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"

          git clone --depth 1 https://github.com/GValiente/butano.git /tmp/butano
          sed -i 's|LIBBUTANO    := ../butano/butano|LIBBUTANO    := /tmp/butano/butano|' Makefile
          ls -la /tmp/butano/butano

      - name: Build ROM
        run: |
          export DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}
          export DEVKITARM=${DEVKITARM:-/opt/devkitpro/devkitARM}
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          make -j$(nproc) 2>&1 || make -j1 2>&1

      - name: Verify ROM exists
        run: |
          test -f mvc2_gba_fan.gba || { echo "ROM not found"; ls -la; exit 1; }
          ls -lh mvc2_gba_fan.gba
          file mvc2_gba_fan.gba || true
          SIZE=$(stat -c%s mvc2_gba_fan.gba)
          echo "ROM size: $SIZE bytes"
          test $SIZE -gt 10000

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvc2-gba-fan-rom
          path: mvc2_gba_fan.gba
          if-no-files-found: error
