name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment + clone Butano
        run: |
          set -euo pipefail

          # Official image uses these paths
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          echo "=== Environment ==="
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          echo "PATH=$PATH"
          echo ""

          echo "=== Checking tools ==="
          which python3 || which python || echo "python not found"
          which make || echo "make not found"
          which arm-none-eabi-gcc || echo "arm-none-eabi-gcc not in PATH yet"
          ls -la $DEVKITARM/bin/arm-none-eabi-gcc || ls -la /opt/devkitpro/devkitARM/bin/ || true
          echo ""

          echo "=== Cloning Butano ==="
          git clone --depth 1 https://github.com/GValiente/butano.git /tmp/butano
          sed -i 's|LIBBUTANO    := ../butano/butano|LIBBUTANO    := /tmp/butano/butano|' Makefile
          ls -la /tmp/butano/butano
          echo "Butano ready."

      - name: Build ROM
        run: |
          set -euo pipefail
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          echo "Building with:"
          which arm-none-eabi-gcc
          arm-none-eabi-gcc --version | head -1

          make -j$(nproc)

      - name: Verify ROM exists
        run: |
          set -euo pipefail
          test -f mvc2_gba_fan.gba || { echo "ROM not found"; ls -la; exit 1; }
          ls -lh mvc2_gba_fan.gba
          file mvc2_gba_fan.gba || true
          SIZE=$(stat -c%s mvc2_gba_fan.gba)
          echo "ROM size: $SIZE bytes"
          test $SIZE -gt 10000

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvc2-gba-fan-rom
          path: mvc2_gba_fan.gba
          if-no-files-found: error
