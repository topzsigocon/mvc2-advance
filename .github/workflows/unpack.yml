name: Unpack update

on:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - 'updates/*.zip'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: unpack
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Safely unpack the uploaded project ZIP
        id: unpack
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=( *.zip updates/*.zip )
          if [ ${#zips[@]} -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          names=()
          for z in "${zips[@]}"; do
            unzip -tq "$z" >/dev/null

            # Reject absolute paths, traversal, and symlinks before extraction.
            if unzip -Z1 "$z" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
              echo "::error::$z contains unsafe paths"
              exit 1
            fi
            if zipinfo -l "$z" | awk 'NR > 3 && substr($1,1,1) == "l" { found=1 } END { exit !found }'; then
              echo "::error::$z contains symbolic links"
              exit 1
            fi

            tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' EXIT
            unzip -q "$z" -d "$tmp"
            src="$tmp"
            mapfile -t top < <(find "$tmp" -mindepth 1 -maxdepth 1)
            if [ ${#top[@]} -eq 1 ] && [ -d "${top[0]}" ] && [ -f "${top[0]}/README.md" ]; then
              src="${top[0]}"
            fi

            # Add/update project files, but never bulk-overwrite repository metadata.
            rsync -a --exclude='.git/' --exclude='.github/' --exclude='*.zip' "$src"/ ./

            # The only workflow file this ZIP may replace is the build workflow.
            # The running unpack workflow and all other repository workflows stay intact.
            ci_source="$src/.github/workflows/ci.yml"
            if [ -f "$ci_source" ]; then
              mkdir -p .github/workflows
              install -m 0644 "$ci_source" .github/workflows/ci.yml
            else
              echo "::error::ZIP must include .github/workflows/ci.yml"
              exit 1
            fi

            git rm -q -f -- "$z"
            rm -rf "$tmp"
            trap - EXIT
            names+=("$(basename "$z")")
          done

          echo "changed=true" >> "$GITHUB_OUTPUT"
          printf 'names=%s\n' "${names[*]}" >> "$GITHUB_OUTPUT"

      - name: Commit and push update
        if: steps.unpack.outputs.changed == 'true'
        env:
          NAMES: ${{ steps.unpack.outputs.names }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Unpack update: ${NAMES}"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Start CI build
        if: steps.unpack.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: gh workflow run ci.yml --ref "$BRANCH"
