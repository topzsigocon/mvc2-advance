name: Unpack update

on:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - 'updates/*.zip'
  workflow_dispatch:

# This workflow may update project files and start CI, but it must never
# modify files inside .github/ (including this workflow and ci.yml).
permissions:
  contents: write
  actions: write

concurrency:
  group: unpack
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Safely unpack project ZIP files (preserve all GitHub workflows)
        id: unpack
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob

          zips=( *.zip updates/*.zip )
          if (( ${#zips[@]} == 0 )); then
            echo "No update ZIP files found."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          processed=()
          for zip_file in "${zips[@]}"; do
            echo "Checking: $zip_file"
            unzip -tq "$zip_file" >/dev/null

            # Reject absolute paths, parent-directory traversal, Windows paths,
            # backslash paths, and symbolic links before extracting anything.
            if unzip -Z1 "$zip_file" | grep -Eq '(^/|(^|/)\.\.(/|$)|^[A-Za-z]:|\\\\)'; then
              echo "::error::Unsafe path detected in $zip_file"
              exit 1
            fi
            if zipinfo -l "$zip_file" | awk 'NR > 3 && substr($1,1,1) == "l" { found=1 } END { exit !found }'; then
              echo "::error::Symbolic links are not allowed in $zip_file"
              exit 1
            fi

            temp_dir="$(mktemp -d)"
            unzip -q "$zip_file" -d "$temp_dir"

            source_dir="$temp_dir"
            mapfile -t top_entries < <(find "$temp_dir" -mindepth 1 -maxdepth 1 -print)
            if (( ${#top_entries[@]} == 1 )) && [[ -d "${top_entries[0]}" ]] && [[ -f "${top_entries[0]}/README.md" ]]; then
              source_dir="${top_entries[0]}"
            fi

            # Add or update project files only. Never extract or overwrite
            # .github/, .git/, ZIP archives, or any workflow configuration.
            rsync -a \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='*.zip' \
              "$source_dir"/ ./

            rm -rf "$temp_dir"
            git rm -q -f -- "$zip_file"
            processed+=("$(basename "$zip_file")")
          done

          echo "changed=true" >> "$GITHUB_OUTPUT"
          printf 'names=%s\n' "${processed[*]}" >> "$GITHUB_OUTPUT"

      - name: Commit and push project update
        if: steps.unpack.outputs.changed == 'true'
        env:
          UPDATE_NAMES: ${{ steps.unpack.outputs.names }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No project file changes to commit."
            exit 0
          fi
          git commit -m "Unpack project update: ${UPDATE_NAMES}"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Start ROM build workflow
        if: steps.unpack.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: gh workflow run ci.yml --ref "$BRANCH"
